name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install and build packages
        shell: bash
        run: |
          for dir in core compressor features design-system electron; do
            (cd "$dir" && npm install && npm run build)
          done

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.exe
            electron/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: release

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.AppImage release/*.deb release/*.exe release/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Redecim $GITHUB_REF_NAME" \
            --generate-notes
