appId: fr.redecim.app
productName: Redecim
artifactName: ${productName}-${version}.${ext}
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: logo.png
  syncDesktopName: true
win:
  target: nsis
  icon: logo.png
mac:
  target: dmg
  icon: logo.png
  category: public.app-category.video
